name: Update Instagram feed

# Pulls the latest posts every morning and commits them.
#
# On the default Behold source this needs NO secrets — a feed ID is public and
# lives in instagram.config.json. On the direct Meta source it needs
# INSTAGRAM_ACCESS_TOKEN, and SECRETS_PAT so the 60-day token can renew itself.

on:
  schedule:
    - cron: '30 2 * * *' # 08:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install image tooling
        run: npm install --no-audit --no-fund sharp

      - name: Fetch latest posts
        id: instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/fetch-instagram.mjs

      # Only relevant on the Meta source, which emits a refreshed token.
      # GITHUB_TOKEN cannot write secrets, so this needs a PAT.
      - name: Persist refreshed token
        if: steps.instagram.outputs.new_token != ''
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          NEW_TOKEN: ${{ steps.instagram.outputs.new_token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning title=Token will expire::SECRETS_PAT is not set, so the refreshed Instagram token cannot be saved. The feed will stop updating within 60 days. See docs/INSTAGRAM_SETUP.md."
            exit 0
          fi
          echo "$NEW_TOKEN" | gh secret set INSTAGRAM_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
          echo "Refreshed token saved to repository secrets."

      - name: Commit updated feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/instagram
          if git diff --staged --quiet; then
            echo "No change to the feed."
          else
            git commit -m "chore: refresh Instagram feed [skip ci]"
            git push
          fi
